[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telemetry-sdk"
version = "2.0.0"
description = "Backend-compatible Python telemetry SDK for structured monitoring, logging, tracing, and secure event delivery."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ShubhamCoder-In", email = "shubhamgarg197@gmail.com" }
]
maintainers = [
    { name = "LogarithmixAI", email = "shubhamgarg197@gmail.com" }
]
keywords = [
    "telemetry",
    "observability",
    "monitoring",
    "python-sdk",
    "logging",
    "tracing",
    "flask",
    "fastapi",
    "django",
    "sqlalchemy"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent"
]

dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/LogarithmixAI"
Organization = "https://github.com/LogarithmixAI"


[project.optional-dependencies]
flask = ["flask>=2.0.0"]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
django = ["django>=3.2"]
sqlalchemy = ["sqlalchemy>=1.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_sdk*"]

[tool.setuptools]
include-package-data = true
